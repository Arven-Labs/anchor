name: Build

# Dispara apenas quando uma tag de versão é criada (ex: v0.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            sidecar_ext: ''
            artifact: '*.deb'
            pyinstaller_data_sep: ':'
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_ext: '.exe'
            artifact: '*.msi'
            pyinstaller_data_sep: ';'
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            sidecar_ext: ''
            artifact: '*.dmg'
            pyinstaller_data_sep: ':'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Dependências nativas do Linux que o Tauri e o keyring precisam
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - name: npm install
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      # Python — pré-requisito do PyInstaller usado no step abaixo (sidecar da
      # Finance API). Não faz cross-compile, precisa rodar no próprio SO alvo.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fase 14.1 — sidecar da Finance API. A fonte (api/sidecar_main.py) vive no repo
      # irmão Lume (ex-easybusiness, hoje em Arven-Labs/lume), fixada por SHA em `.lume-version` (sem
      # submodule — só um checkout num ref pinado). `--add-data` é necessário porque
      # `_run_migrations` lê `migrations/`/`alembic.ini` direto do disco em runtime (Alembic),
      # não via `import` — sem isso o binário quebra com "Path doesn't exist: .../migrations"
      # (achado ao vivo na Fase 14.2, Sessão 90). O separador do `--add-data` muda por SO
      # (`matrix.pyinstaller_data_sep`): `:` no Linux/macOS, `;` no Windows.
      - name: Read Lume pinned ref
        id: lume-ref
        shell: bash
        run: echo "sha=$(cat .lume-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout Lume
        uses: actions/checkout@v4
        with:
          repository: Arven-Labs/lume
          ref: ${{ steps.lume-ref.outputs.sha }}
          path: lume

      - name: Build Finance API sidecar
        working-directory: lume/api
        shell: bash
        run: |
          pip install -r requirements.txt -r requirements-sidecar-build.txt
          pyinstaller --onefile --name anchor-finance-api-${{ matrix.rust_target }} \
            --add-data "$(pwd)/migrations${{ matrix.pyinstaller_data_sep }}migrations" \
            --add-data "$(pwd)/alembic.ini${{ matrix.pyinstaller_data_sep }}." \
            --distpath dist --workpath build --specpath . sidecar_main.py
          mkdir -p ../../desktop/src-tauri/binaries
          mv dist/anchor-finance-api-${{ matrix.rust_target }}${{ matrix.sidecar_ext }} ../../desktop/src-tauri/binaries/

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Anchor ${{ github.ref_name }}
          releaseDraft: true
          includeDebug: false

  # APK do companion Flutter, anexado ao mesmo release em rascunho. Por enquanto assinado
  # com a chave de debug (`signingConfig` em mobile/android/app/build.gradle.kts), o que
  # basta pra instalar no celular mas não serve pra Play Store. Quando houver versão
  # oficial, trocar por keystore próprio guardado nos secrets do GitHub.
  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter build apk
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Renomeia o APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk anchor-${{ github.ref_name }}.apk

      - name: Anexa ao release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchor ${{ github.ref_name }}
          draft: true
          files: anchor-${{ github.ref_name }}.apk
