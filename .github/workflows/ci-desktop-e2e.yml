name: CI Desktop E2E

# E2E do app real: o binário debug (Rust + React embutido + SQLite descartável)
# dirigido por tauri-driver/WebDriver sob xvfb. Testes em desktop/e2e/.
#
# Roda quando muda o frontend, o backend Rust ou os próprios testes (o app real
# usa os dois lados). Com cache do Rust leva ~5 min; sem cache, bem mais.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/src/**'
      - 'desktop/src-tauri/**'
      - 'desktop/e2e/**'
      - 'desktop/package*.json'
      - '.github/workflows/ci-desktop-e2e.yml'
  # Em PR quem chama é o ci.yml (filtro de caminho + job `gate`), por `workflow_call`.
  workflow_call:
  workflow_dispatch:

# Grupo fixo: em `workflow_call`, `github.workflow` é o nome do chamador e os 5 CIs se cancelariam.
concurrency:
  group: ci-desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # 24.04: o webkit2gtk-driver do 22.04 é da API 4.0 e o app usa a 4.1.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json

      # Mesma lista do ci-desktop-rust.yml, mais o WebKitWebDriver (o que o
      # tauri-driver usa), o servidor X virtual e o D-Bus de sessão.
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            webkit2gtk-driver \
            xvfb \
            dbus \
            sqlite3

      - name: App npm deps
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      # Debug com frontend embutido: `tauri build` roda o `npm run build` e liga o
      # `custom-protocol`; `--debug` mantém `debug_assertions` (banco descartável por `ANCHOR_DB_PATH`).
      - name: Build app (debug, sem instalador)
        working-directory: desktop
        run: npx tauri build --debug --no-bundle

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: E2E npm deps
        working-directory: desktop/e2e
        run: npm ci

      - name: E2E
        working-directory: desktop/e2e
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a dbus-run-session -- npm test

      # Sobe sempre: em falha, a captura do teste que quebrou; com tudo verde, as telas-chave tiradas por
      # `snap()` (specs), para conferir o visual baixando o artefato em vez de abrir o app.
      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: desktop/e2e/artifacts
          retention-days: 14
          if-no-files-found: ignore
