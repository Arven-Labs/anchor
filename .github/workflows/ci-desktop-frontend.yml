name: CI Desktop Frontend

# Checagem de tipos e build do frontend (React/TS), só quando algo dele muda.
# O backend Rust tem workflow próprio (ci-desktop-rust.yml).
on:
  push:
    branches: [main]
    paths:
      - 'desktop/src/**'
      - 'desktop/public/**'
      - 'desktop/index.html'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/tsconfig*.json'
      - 'desktop/vite.config.ts'
      - 'desktop/components.json'
      - '.github/workflows/ci-desktop-frontend.yml'
  # Em PR quem chama é o ci.yml (filtro de caminho + job `gate`), por `workflow_call`.
  workflow_call:
  workflow_dispatch:

# Grupo fixo: em `workflow_call`, `github.workflow` é o nome do chamador e os 5 CIs se cancelariam.
concurrency:
  group: ci-desktop-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm install
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      # `tsc && vite build` — checa os tipos e confirma que o bundle gera
      - name: Frontend build
        working-directory: desktop
        run: npm run build
