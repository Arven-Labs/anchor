name: CI Mobile

# Análise e testes do companion Flutter a cada push/PR que mexa em mobile/.
# Substitui rodar `./dev.sh flutter test` no Docker local.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ci-mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/ci-mobile.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: flutter test
        working-directory: mobile
        run: flutter test
