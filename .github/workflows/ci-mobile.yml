name: CI Mobile

# Análise e testes do companion Flutter a cada push/PR que mexa em mobile/.
# Substitui rodar `./dev.sh flutter test` no Docker local.
# Em PR quem chama é o ci.yml (filtro de caminho + job `gate`), por `workflow_call`.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ci-mobile.yml']
  workflow_call:
  workflow_dispatch:

# Grupo fixo: em `workflow_call`, `github.workflow` é o nome do chamador e os 5 CIs se cancelariam.
concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: flutter test
        working-directory: mobile
        run: flutter test

      # O CI não tem emulador: renderiza as telas de Finanças em teste de
      # widget (com a Roboto do SDK) e publica os PNGs para conferir o visual.
      - name: Capturas das telas de Finanças
        working-directory: mobile
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/financas-shots
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          flutter test test/financas_screenshots_test.dart

      - name: Upload capturas
        uses: actions/upload-artifact@v4
        with:
          name: mobile-financas-screenshots
          path: ${{ runner.temp }}/financas-shots/*.png
          if-no-files-found: error

  # APK de teste sob demanda (botão "Run workflow"). Assinado com a chave de debug,
  # serve pra instalar direto no celular. O APK de release sai no build.yml, junto da tag.
  apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter build apk
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anchor-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
