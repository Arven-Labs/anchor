name: CI Contracts

# Testes dos contratos Solidity (Foundry) a cada push na main que mexa em contracts/.
# Em PR quem chama é o ci.yml (filtro de caminho + job `gate`), por `workflow_call`.
on:
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/ci-contracts.yml']
  workflow_call:
  workflow_dispatch:

# Grupo fixo: em `workflow_call`, `github.workflow` é o nome do chamador e os 5 CIs se cancelariam.
concurrency:
  group: ci-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: forge test
        working-directory: contracts
        run: forge test -vv
