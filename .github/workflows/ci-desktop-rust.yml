name: CI Desktop Rust

# Testes do backend Rust do app desktop, só quando algo em desktop/src-tauri/ muda.
# O frontend tem workflow próprio (ci-desktop-frontend.yml).
on:
  push:
    branches: [main]
    paths: ['desktop/src-tauri/**', '.github/workflows/ci-desktop-rust.yml']
  pull_request:
    paths: ['desktop/src-tauri/**', '.github/workflows/ci-desktop-rust.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Mesma lista do build.yml — dependências nativas do Tauri e do keyring
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            pkg-config

      # O tauri-build exige que o `frontendDist` (../dist) exista no disco. Os
      # testes não o usam, então um placeholder basta (o frontend real é validado
      # no ci-desktop-frontend.yml).
      - name: Placeholders
        run: |
          mkdir -p desktop/dist
          echo '<!doctype html>' > desktop/dist/index.html

      # Testes `#[ignore]` (ao vivo, vão às fontes públicas) ficam de fora, como no local
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --lib
