[package]
name = "anchor"
version = "0.1.0"
description = "Anchor — personal stock/crypto valuation tracker"
authors = ["masterlxz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anchor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
notify-rust = "4"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
# Roda as migrations ao abrir o banco (`db::connect`) e nos testes de fluxo.
migration = { path = "migration" }
thiserror = "2"
chrono = "0.4"
tokio = { version = "1", features = ["process", "time", "macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
futures = "0.3"
if-addrs = "0.13"
hkdf = "0.12"
ed25519-dalek = "2"
alloy-primitives = "1.6.1"
alloy-sol-types = "1.6.1"

# Menos informação de debug no dev: o target/ ocupava ~7 GB. Backtraces continuam
# com arquivo/linha no nosso código; as dependências ficam sem debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

