[package]
name = "anchor"
version = "0.1.1"
description = "Anchor — personal stock/crypto valuation tracker"
authors = ["masterlxz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anchor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
notify-rust = "4"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
# Roda as migrations ao abrir o banco (`db::connect`) e nos testes de fluxo.
migration = { path = "migration" }
thiserror = "2"
chrono = "0.4"
tokio = { version = "1", features = ["process", "time", "macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
# Fase 26 — zips da B3 (curva DI) e, adiante, da CVM e do COTAHIST.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Fase 26 — CSVs `;` da CVM (DFP, FII).
csv = "1"
# Fase 34 — planilha "Negociação" da Área do Investidor da B3 (xlsx).
calamine = { version = "0.37", default-features = false, features = ["chrono"] }
# Fase 32 — `erf` pro Black-Scholes das opções (a std não tem).
libm = "0.2"
futures = "0.3"
if-addrs = "0.13"
hkdf = "0.12"
ed25519-dalek = "2"
alloy-primitives = "1.6.1"
alloy-sol-types = "1.6.1"
# Visualizador de wallets (ADR 0002, Fase 36.2): fala com a Ledger por USB HID, só para ler endereço.
hidapi = "2.6"
# Fase 36.3: o Trezor, só a feature `ethereum`. A crate tem funções de assinar; o Anchor nunca as
# chama (ADR 0002, adendo; guarda em `wallet_viewer/tests.rs` e teste do transporte falso).
trezor-client = { version = "0.1.6", default-features = false, features = ["ethereum"] }
# Fase 36.4a: Bitcoin só leitura. Deriva endereços de uma xpub/zpub (BIP32, P2PKH e P2WPKH); o Anchor
# nunca guarda chave privada. Fixada em `=0.32.11` (linha 0.32.1x, MSRV baixo): a 0.32.10x sobe o MSRV
# e a 0.33 só existe em beta.
bitcoin = { version = "=0.32.11", default-features = false, features = ["std"] }

[dev-dependencies]
# Só para montar respostas falsas do Trezor nos testes; a mesma 3.7.2 que o `trezor-client` fixa.
protobuf = "3.7"

# Menos informação de debug no dev: o target/ ocupava ~7 GB. Backtraces continuam
# com arquivo/linha no nosso código; as dependências ficam sem debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

